<script src="js/supabase.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        let map;
        let markers = {};
        let currentAdminUser = null;

        function initMap() {
            map = L.map('map').setView([-0.2292, 100.6308], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        async function checkAuth() {
            const { data: { session } } = await supabaseAdmin.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            const { data: adminProfile } = await supabaseAdmin
                .from('users')
                .select('name, branch, city')
                .eq('id', session.user.id)
                .maybeSingle();

            currentAdminUser = adminProfile || {};
            
            const branch = adminProfile?.branch;
            const city = adminProfile?.city;
            const locationText = (!branch || !city || branch === 'ALL' || city === 'ALL') ? 'Super Admin' : `${branch} - ${city}`;

            // Render Sidebar
            renderSidebar('dashboard', 'sidebar-container', {
                name: adminProfile?.name || session.user.email.split('@')[0],
                role: locationText
            }, async () => {
                await supabaseAdmin.auth.signOut();
                window.location.href = 'login.html';
            });
        }

        async function fetchDashboardStats() {
            try {
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                const todayISO = now.toISOString();

                let transQuery = supabaseAdmin
                    .from('transactions')
                    .select('total_price, payment_method, total_cups')
                    .eq('payment_status', 'success')
                    .gte('created_at', todayISO);

                const { data: trans } = await transQuery;

                if (trans) {
                    const todayCash = trans
                        .filter(t => t.payment_method === 'CASH')
                        .reduce((sum, t) => sum + (t.total_price || 0), 0);
                    const totalCups = trans.reduce((sum, t) => sum + (t.total_cups || 0), 0);

                    document.getElementById('statTodayCash').innerText = `Rp ${todayCash.toLocaleString('id-ID')}`;
                    document.getElementById('statTodayCups').innerText = `${totalCups} Cup`;
                }

                let salesQuery = supabaseAdmin
                    .from('users')
                    .select('*', { count: 'exact', head: true })
                    .eq('role', 'sales');

                if (currentAdminUser?.branch) {
                    salesQuery = salesQuery.eq('branch', currentAdminUser.branch);
                }
                if (currentAdminUser?.city) {
                    salesQuery = salesQuery.eq('city', currentAdminUser.city);
                }

                const { count: salesCount } = await salesQuery;
                document.getElementById('statTotalSales').innerText = `${salesCount || 0} Sales`;

            } catch (err) {
                console.log('Error fetch stats:', err);
            }
        }

        async function fetchCartUnits() {
            try {
                let unitsQuery = supabaseAdmin
                    .from('cart_units')
                    .select(`
                        id,
                        unit_name,
                        vehicle_type,
                        is_open,
                        latitude,
                        longitude,
                        users!inner (
                            id,
                            name,
                            branch,
                            city
                        )
                    `);

                if (currentAdminUser?.branch) {
                    unitsQuery = unitsQuery.eq('users.branch', currentAdminUser.branch);
                }
                if (currentAdminUser?.city) {
                    unitsQuery = unitsQuery.eq('users.city', currentAdminUser.city);
                }

                const { data: units, error } = await unitsQuery;

                if (error) throw error;

                const openCount = (units || []).filter(u => u.is_open).length;
                document.getElementById('statOpenUnits').innerText = `${openCount} Unit`;

                const listContainer = document.getElementById('cartUnitsList');
                listContainer.innerHTML = '';

                if (!units || units.length === 0) {
                    listContainer.innerHTML = `<p class="text-xs text-zinc-400 text-center py-8">Belum ada unit gerobak di cabang ini.</p>`;
                    return;
                }

                units.forEach(unit => {
                    const salesName = unit.users?.name || 'Sales Belum Set';
                    const isOpen = unit.is_open;

                    const card = document.createElement('div');
                    card.className = 'p-3 rounded-xl border border-zinc-100 bg-zinc-50 space-y-2';
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-xs font-extrabold text-zinc-900">${salesName}</p>
                                <p class="text-[11px] text-zinc-500 font-medium">${unit.unit_name} (${unit.vehicle_type || 'Sepeda'})</p>
                            </div>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-md ${isOpen ? 'bg-green-100 text-green-700' : 'bg-zinc-200 text-zinc-600'}">
                                ${isOpen ? '● BUKA' : 'OFFLINE'}
                            </span>
                        </div>
                        <div class="pt-1 border-t border-zinc-200/60 flex justify-end">
                            <button onclick="openStockModal('${unit.id}', '${salesName}', '${unit.unit_name}')" class="text-[11px] font-bold text-zinc-700 hover:text-black bg-white hover:bg-zinc-100 border border-zinc-200 px-3 py-1 rounded-lg transition">
                                🔍 Cek Stok Gerobak
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(card);

                    if (isOpen && unit.latitude && unit.longitude) {
                        const popupContent = `
                            <div class="text-center font-sans">
                                <b style="font-size: 13px;">${salesName}</b><br>
                                <span style="font-size: 11px; color: #666;">${unit.unit_name}</span><br>
                                <button onclick="openStockModal('${unit.id}', '${salesName}', '${unit.unit_name}')" 
                                        style="margin-top: 6px; background: #000; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">
                                    Cek Stok
                                </button>
                            </div>
                        `;

                        if (markers[unit.id]) {
                            markers[unit.id].setLatLng([unit.latitude, unit.longitude]).setPopupContent(popupContent);
                        } else {
                            const newMarker = L.marker([unit.latitude, unit.longitude])
                                .addTo(map)
                                .bindPopup(popupContent);
                            markers[unit.id] = newMarker;
                        }
                    } else if (markers[unit.id]) {
                        map.removeLayer(markers[unit.id]);
                        delete markers[unit.id];
                    }
                });

            } catch (err) {
                console.log('Error fetch cart units:', err);
            }
        }

        async function openStockModal(cartUnitId, salesName, unitName) {
            document.getElementById('stockModalSalesName').innerText = `Stok Gerobak: ${salesName}`;
            document.getElementById('stockModalUnitName').innerText = unitName;

            const listContainer = document.getElementById('stockItemsList');
            listContainer.innerHTML = '<p class="text-xs text-zinc-400 text-center py-6">Memuat sisa stok...</p>';

            const modal = document.getElementById('stockModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const { data: cartStocks, error } = await supabaseAdmin
                    .from('cart_stocks')
                    .select(`
                        quantity,
                        products (
                            name,
                            category
                        )
                    `)
                    .eq('cart_unit_id', cartUnitId);

                if (error) throw error;

                listContainer.innerHTML = '';

                if (!cartStocks || cartStocks.length === 0) {
                    listContainer.innerHTML = '<p class="text-xs text-zinc-400 text-center py-6">Gerobak ini belum memiliki stok.</p>';
                    return;
                }

                cartStocks.forEach(item => {
                    const prodName = item.products?.name || 'Produk';
                    const category = item.products?.category || 'Kategori';
                    const qty = item.quantity || 0;

                    const div = document.createElement('div');
                    div.className = 'py-2.5 flex justify-between items-center text-xs';
                    div.innerHTML = `
                        <div>
                            <p class="font-bold text-zinc-800">${prodName}</p>
                            <p class="text-[10px] text-zinc-400 font-semibold">${category}</p>
                        </div>
                        <span class="font-extrabold text-black bg-zinc-100 px-2.5 py-1 rounded-md ${qty === 0 ? 'text-red-500' : ''}">${qty} Cup</span>
                    `;
                    listContainer.appendChild(div);
                });
            } catch (err) {
                console.error('Error load cart stocks:', err);
                listContainer.innerHTML = '<p class="text-xs text-red-500 text-center py-6">Gagal memuat stok gerobak.</p>';
            }
        }

        function closeStockModal() {
            const modal = document.getElementById('stockModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            initMap();
            await fetchDashboardStats();
            await fetchCartUnits();

            setInterval(() => {
                fetchCartUnits();
                fetchDashboardStats();
            }, 10000);
        });
    </script>
