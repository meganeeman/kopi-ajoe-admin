<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Kopi Ajoe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl border border-zinc-200">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-black text-white rounded-2xl flex items-center justify-center font-extrabold text-2xl mx-auto mb-4 shadow-lg">
                KA
            </div>
            <h1 class="text-2xl font-extrabold text-zinc-900 tracking-tight">Kopi Ajoe Admin</h1>
            <p class="text-xs text-zinc-500 font-medium mt-1">Masuk untuk mengelola operasional gerobak & stok</p>
        </div>

        <div id="errorAlert" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs font-semibold text-center">
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-zinc-700 uppercase tracking-wider mb-2">Email Admin</label>
                <input 
                    type="email" 
                    id="emailInput"
                    required
                    placeholder="admin@kopiajoe.com" 
                    class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-black text-sm font-medium transition"
                >
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-700 uppercase tracking-wider mb-2">Kata Sandi</label>
                <input 
                    type="password" 
                    id="passwordInput"
                    required
                    placeholder="••••••••" 
                    class="w-full px-4 py-3.5 rounded-xl border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-black text-sm font-medium transition"
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-black text-white font-bold py-3.5 rounded-xl text-sm shadow-md hover:bg-zinc-800 transition active:scale-[0.98]"
            >
                MASUK KE DASHBOARD
            </button>
        </form>

        <p class="text-center text-xs text-zinc-400 font-medium mt-8">
            Kopi Ajoe Control Panel • v1.0.0
        </p>

    </div>

    <script src="js/supabase.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'MEMPROSES...';

            try {
                const { data, error } = await supabaseAdmin.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                const user = data.user;
                const { data: userData, error: userError } = await supabaseAdmin
                    .from('users')
                    .select('role')
                    .eq('id', user.id)
                    .maybeSingle();

                if (userError || userData?.role !== 'admin') {
                    await supabaseAdmin.auth.signOut();
                    throw new Error('Akses ditolak. Akun kamu bukan akun Admin!');
                }

                window.location.href = 'index.html';

            } catch (err) {
                errorAlert.innerText = err.message || 'Gagal masuk. Periksa email dan password!';
                errorAlert.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'MASUK KE DASHBOARD';
            }
        });
    </script>
</body>
</html>
